<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="قالب فروشگاه تلگرامی RR Bot Academy">
  <title>فروشگاه آرآر</title>
  <link rel="stylesheet" href="/shop.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/shop.js"></script>
</head>
<body>
  <div class="app">
    <header id="header" class="app-header"></header>
    <main id="screen" class="screen" aria-label="فروشگاه" aria-busy="true">
      <p class="loading" role="status">در حال باز کردن فروشگاه…</p>
    </main>
    <nav id="navigation" class="nav" aria-label="بخش‌های فروشگاه" hidden></nav>
    <div id="notice" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <noscript>برای استفاده از فروشگاه، JavaScript مرورگر را فعال کنید.</noscript>
</body>
</html>
